<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    form{
        padding: 50px;
        display: flex;
        flex-direction: column;
        width: 300px;
        gap: 10px;
    }

    input[type="email"]{
        outline: nome;
        appearance: none;

    }

    input[type="file"]{

    }

    label[for="file"]{

        box-sizing: border-box;

    }

    select{

    }

    .teste{
        padding: 100px;

            h1{
            color: white;
            }

    }
    
    </style>
</head>

    <main>
        <form action="script.js" method="get">

            <label for="email"> adicione email</label>

            <label for="file">Adcione foto</label>

                <option value="comer"> deitar</option>

        <div class="teste">

            </div>
        </div>
    </main>
    
</body>
</html>
