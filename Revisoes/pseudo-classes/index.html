<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .teste:first-child{
        background-color: red;
    }

    a {
       position: relative;
       text-decoration: none;
    }

    

    a::after {
        content: "";
        position: absolute;
        width: 0;
        height: 2px;
        background: red;
        bottom: 0;
        left: 0;
        transition: 0.3s;
    }

    a:hover::after {
    width: 100%;
    }

    
</style>
<body>

    <main>
        <h1>hello worlds</h1>
        <div class="teste">
            <div class="el-1"></div>
            <div class="el-2"></div>
            <input type="text" name="" id="">
            <input type="email" name="" id="">
        </div>

        <a href="">aaaaaaaaaaaaaaaaaaaaaa</a>
    </main>
</body>
</html>
