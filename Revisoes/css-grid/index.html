<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        padding-top: 100px;
    }
    main{
        margin: auto;
        max-width: 600px;
    }

    div{
        gap: 5px;
        text-align: center;
        margin-block: 50px;
    }

    .grid-1{
        border: solid 1px black;
        display: grid;
        grid-template-columns: 1fr 110px 1fr;
        grid-template-rows: 60px 120px 60px ;
        row-gap: 50px;
        padding-block: 50px;
    }


    span{
        background-color: aqua;
    }

    .grid-2{
        display: grid;
        grid-template-areas: 
        "header header header"
        "siderbar content1 content1"
        "siderbar content2 content3"
        "footer footer footer";

        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: 30px 100px 100px 30px;
    }

    .header{
        grid-area: header;
    }

    .content1{
        grid-area: content1;
    }

    .siderbar{
        grid-area: siderbar;
    }

    .content2{
        grid-area: content2;
    }

    .content3{
        grid-area: content3;
    }

    .footer{
        grid-area: footer;
    }


    .grid-3{
        display: grid;
        grid-template-areas: 
        "header2 header2 header2 header2"
        ". main-content sidebar2 ."
        ". twin1 twin2 . "
        "footer2 footer2 footer2 footer2";

        grid-template-rows: 50px 100px 100px 50px ;
    }

    .header2{
        grid-area: header2;
    }
    .main-content{
        grid-area: main-content;
    }
    .sidebar2{
        grid-area: sidebar2;
    }
    .twin1{
        grid-area: twin1;
    }
    .twin2{
        grid-area: twin2;
    }
    .footer2{
        grid-area: footer2;
    }


    .grid-4{
        display: grid;
        grid-template: repeat(3, 100px) / 1fr 1fr 1fr 1fr;
    }
    .ele1{
        grid-row: 1/4;
    }
    .ele2{
        grid-column: 2/4
    }
    .ele6{
        grid-column: 4;
        grid-row: 2/4;
    }

</style>
<body>
    
    <main>

        <div class="container">
            Grid 1
            <div class="grid-1">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>5</span>
                <span>5</span>
                <span>5</span>
                <span>5</span>
            </div>
        </div>

        <div class="container2">
            Grid 2
            <div class="grid-2">
                <span class="header">header</span>
                <span class="siderbar">siderar</span>
                <span class="content1">content1</span>
                <span class="content2">content2</span>
                <span class="content3">content3</span>
                <span class="footer">footer</span>
            </div>
            
        </div>

        <div class="container3">
            Grid 3
            <div class="grid-3">
                <span class="header2">header</span>
                <span class="main-content">main-content</span>
                <span class="sidebar2">sidebar2</span>
                <span class="twin1">twin</span>
                <span class="twin2">twin2</span>
                <span class="footer2">footer</span>
            </div>
        </div>

        <div class="container4">
            Grid 4
            <div class="grid-4">
                <span class="ele1">ele1</span>
                <span class="ele2">ele2</span>
                <span class="ele3">ele3</span>
                <span class="ele4">ele4</span>
                <span class="ele5">ele5</span>
                <span class="ele6">ele6</span>
                <span class="ele7">ele8</span>
                <span class="ele8">ele8</span>
            </div>
        </div>
        
    </main>


</body>
</html>
